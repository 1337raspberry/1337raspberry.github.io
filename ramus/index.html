<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ramus</title>
<meta name="description" content="a genre-first music player for plex">
<meta name="theme-color" content="#070609">
<meta property="og:title" content="ramus">
<meta property="og:description" content="a genre-first music player for plex">
<meta property="og:type" content="video.other">
<meta property="og:url" content="https://1337raspberry.github.io/ramus/">
<meta property="og:image" content="https://1337raspberry.github.io/ramus/poster.jpg">
<meta property="og:video" content="https://1337raspberry.github.io/ramus/ramus.mp4">
<meta property="og:video:type" content="video/mp4">
<meta property="og:video:width" content="1920">
<meta property="og:video:height" content="1080">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://raw.githubusercontent.com/1337raspberry/ramus/main/ramus-tauri/icons/icon.png">
<link rel="stylesheet" href="play.css">
<style>
  :root { color-scheme: dark; }
  html, body { background: #070609; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100svh;
    padding: 16px;
    box-sizing: border-box;
    display: grid;
    place-items: center;
  }
  main { width: min(100%, 1280px); }
  footer {
    display: flex;
    justify-content: flex-end;
    padding-top: 14px;
    font: 400 13px/1.4 "JetBrains Mono", ui-monospace, monospace;
  }
  footer a { color: #9e9ea0; text-decoration: none; }
  footer a:hover, footer a:focus-visible { color: #f1f1f3; }
</style>
</head>
<body>
<main>
  <div class="card">
    <video src="ramus.mp4" poster="poster.jpg" preload="auto" playsinline controls></video>
    <button class="play" type="button" hidden aria-label="play the video with sound"><img src="poster.jpg" alt=""></button>
    <button class="sound" type="button" hidden aria-label="play the video with sound, from the start">
      <span class="pill">
        <span class="disc"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M3 9.5v5a1 1 0 0 0 1 1h3l4.4 3.6a1 1 0 0 0 1.6-.8V5.7a1 1 0 0 0-1.6-.8L7 8.5H4a1 1 0 0 0-1 1Z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4.5 4.5 0 0 1 0 6M18.8 6.2a8.5 8.5 0 0 1 0 11.6"/></svg></span>
        <span class="label"><span class="title">play with sound</span><span class="meta">from the start</span></span>
      </span>
    </button>
  </div>
  <footer><a href="https://github.com/1337raspberry/ramus">github.com/1337raspberry/ramus</a></footer>
</main>
<script>
  // Browsers play sound without a click on this page only for sites the
  // visitor already uses (the README's link is on another site), so the film
  // tries to start with sound, then muted with a button that restarts it with
  // sound. If even that is refused (or paused, as in a background tab), the
  // poster comes back over the card as its play button.
  const video = document.querySelector("video");
  const play = document.querySelector(".play");
  const sound = document.querySelector(".sound");
  video.controls = false;

  function playWithSound() {
    play.hidden = true;
    sound.hidden = true;
    video.muted = false;
    video.controls = true;
    video.play();
  }

  play.addEventListener("click", playWithSound);
  sound.addEventListener("click", () => {
    video.currentTime = 0;
    playWithSound();
  });

  video
    .play()
    .then(() => {
      video.controls = true;
    })
    .catch(() => {
      video.muted = true;
      return video.play().then(() => {
        sound.hidden = false;
      });
    })
    .catch(() => {
      video.muted = false;
      play.hidden = false;
    });
</script>
</body>
</html>
